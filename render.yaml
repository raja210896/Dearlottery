# Render Blueprint for the LotteryAnalytics API.
# Deploy via the Render dashboard: New > Blueprint > point at this repo.
# Secrets (marked "sync: false") are NOT stored here — set their real values in the
# Render dashboard after the service is created. Nothing sensitive is committed.
services:
  - type: web
    name: lotteryanalytics-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Azure SQL / production SQL Server connection string. Set in the Render dashboard.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      # Long random secret (32+ chars) used to sign admin JWTs. Set in the Render dashboard.
      - key: Jwt__Secret
        sync: false
      - key: Jwt__Issuer
        value: LotteryAnalytics
      - key: Jwt__Audience
        value: LotteryAnalytics
      # First admin account, created once on startup if no AdminUsers row exists yet.
      - key: AdminBootstrap__Username
        sync: false
      - key: AdminBootstrap__Password
        sync: false
      # Deployed Vercel frontend origin, e.g. https://your-app.vercel.app (no trailing slash).
      - key: FRONTEND_URL
        sync: false
      # Optional integrations — leave unset to keep them disabled, exactly like local dev.
      - key: Sambad__BaseUrl
        sync: false
      - key: Sambad__Token
        sync: false
      - key: WebPush__PublicKey
        sync: false
      - key: WebPush__PrivateKey
        sync: false
      - key: WebPush__Subject
        sync: false
