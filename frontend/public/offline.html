<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — LotteryAnalytics</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; text-align: center; padding: 24px; }
    .box { max-width: 320px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; }
    button { margin-top: 16px; padding: 10px 18px; border-radius: 10px; border: none; background: #2563eb; color: #fff; font-weight: 600; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>You're offline</h1>
    <p>LotteryAnalytics needs a connection to load fresh results. Cached pages you've visited may still be available.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
